<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Space Invaders — Modular</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hud" id="hud">Score: 0 &nbsp; Lives: 3</div>
  <canvas id="game" width="480" height="640"></canvas>
  <div class="center" id="overlay" style="display:none;">
    <h1 id="message"></h1>
    <button id="restart">Restart</button>
  </div>
    
  <div class="center" id="pauseOverlay" style="display:none;">
    <h2 id="pauseMessage">Paused</h2>
    <div style="display:flex; gap:8px; justify-content:center;">
      <button id="resumeBtn">Resume</button>
      <button id="restartBtnFromPause">Restart</button>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
