<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Space Invaders — Minimal</title>
<style>
  html,body { height:100%; margin:0; background:#111; display:flex; align-items:center; justify-content:center; font-family:Arial,Helvetica,sans-serif; color:#eee; }
  #game { background:#000; image-rendering: pixelated; }
  .hud { position: absolute; top:12px; left:12px; color:#fff; font-weight:700; text-shadow:0 0 6px rgba(0,0,0,.7); }
  .center { position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  button { padding:8px 12px; font-size:16px; }
</style>
</head>
<body>
<div class="hud" id="hud">Score: 0 &nbsp; Lives: 3</div>
<canvas id="game" width="480" height="640"></canvas>
<div class="center" id="overlay" style="display:none;">
  <h1 id="message"></h1>
  <button id="restart">Restart</button>
</div>

<script>
// ====== Настройки ======
const CANVAS_W = 480, CANVAS_H = 640;
const PLAYER_W = 40, PLAYER_H = 12;
const PLAYER_SPEED = 260; // px/s
const BULLET_SPEED = 420;
const INVADER_ROWS = 4;
const INVADER_COLS = 8;
const INVADER_W = 30, INVADER_H = 18;
const INVADER_H_SPACING = 18; // між колонками
const INVADER_V_SPACING = 18;
const INVADER_X_MARGIN = 30;
const INVADER_Y_MARGIN = 60;
const INVADER_BASE_SPEED = 30;
const INVADER_DROP = 22;
const ENEMY_BULLET_SPEED = 160;
const FIRE_COOLDOWN = 0.32; // сек

// ====== Сцена ======
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_W; canvas.height = CANVAS_H;

const hud = document.getElementById('hud');
const overlay = document.getElementById('overlay');
const message = document.getElementById('message');
document.getElementById('restart').onclick = () => startGame();

// ====== Стан гри ======
let keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

let lastTime = null;
let game = null;

function startGame(){
  overlay.style.display = 'none';
  game = {
    player: { x: CANVAS_W/2 - PLAYER_W/2, y: CANVAS_H - 60, w: PLAYER_W, h: PLAYER_H, lives: 3 },
    playerBullets: [],
    enemyBullets: [],
    invaders: [],
    invaderDir: 1, // 1 вправо, -1 вліво
    invaderSpeed: INVADER_BASE_SPEED,
    invaderTimer: 0,
    score: 0,
    fireTimer: 0,
    gameOver: false
  };

  // створити натовп ворогів
  for (let r=0; r<INVADER_ROWS; r++){
    for (let c=0; c<INVADER_COLS; c++){
      const x = INVADER_X_MARGIN + c*(INVADER_W+INVADER_H_SPACING);
      const y = INVADER_Y_MARGIN + r*(INVADER_H+INVADER_V_SPACING);
      game.invaders.push({x,y,w:INVADER_W,h:INVADER_H,row:r,col:c,alive:true});
    }
  }
  lastTime = null;
  requestAnimationFrame(loop);
}

function loop(ts){
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  if (!game.gameOver) requestAnimationFrame(loop);
}

function update(dt){
  // player movement
  const p = game.player;
  if (keys['ArrowLeft'] || keys['KeyA']) p.x -= PLAYER_SPEED*dt;
  if (keys['ArrowRight']|| keys['KeyD']) p.x += PLAYER_SPEED*dt;
  p.x = Math.max(6, Math.min(CANVAS_W - p.w - 6, p.x));

  // firing
  game.fireTimer -= dt;
  if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && game.fireTimer <= 0){
    shootPlayer();
    game.fireTimer = FIRE_COOLDOWN;
  }

  // update bullets
  for (let b of game.playerBullets) b.y -= BULLET_SPEED*dt;
  game.playerBullets = game.playerBullets.filter(b => b.y + b.h > 0);

  for (let b of game.enemyBullets) b.y += ENEMY_BULLET_SPEED*dt;
  game.enemyBullets = game.enemyBullets.filter(b => b.y < CANVAS_H);

  // invaders movement: determine bounds
  const aliveInvaders = game.invaders.filter(i=>i.alive);
  if (aliveInvaders.length === 0) {
    win();
    return;
  }

  // compute leftmost and rightmost
  let left = Infinity, right = -Infinity;
  for (let inv of aliveInvaders){ left = Math.min(left, inv.x); right = Math.max(right, inv.x + inv.w); }

  // change direction if hit walls
  const margin = 6;
  if (right + game.invaderDir * game.invaderSpeed * dt > CANVAS_W - margin && game.invaderDir === 1) {
    moveInvadersDown();
  } else if (left + game.invaderDir * game.invaderSpeed * dt < margin && game.invaderDir === -1) {
    moveInvadersDown();
  } else {
    for (let inv of aliveInvaders) inv.x += game.invaderDir * game.invaderSpeed * dt;
  }

  // invaders occasionally fire
  game.invaderTimer += dt;
  if (game.invaderTimer > 0.6) {
    enemyFire();
    game.invaderTimer = 0;
  }

  // collisions: player bullets -> invaders
  for (let b of game.playerBullets){
    for (let inv of game.invaders){
      if (!inv.alive) continue;
      if (rectsOverlap(b,inv)){
        inv.alive = false;
        b.hit = true;
        game.score += 10;
        // increase speed slightly
        game.invaderSpeed += 1.6;
      }
    }
  }
  game.playerBullets = game.playerBullets.filter(b => !b.hit);

  // enemy bullets -> player
  for (let b of game.enemyBullets){
    if (rectsOverlap(b, p)){
      b.hit = true;
      playerHit();
    }
  }
  game.enemyBullets = game.enemyBullets.filter(b => !b.hit);

  // invaders reach player
  for (let inv of aliveInvaders){
    if (inv.y + inv.h >= p.y){
      lose();
      return;
    }
  }

  // update HUD
  hud.innerHTML = `Score: ${game.score} &nbsp; Lives: ${game.player.lives}`;
}

function moveInvadersDown(){
  game.invaderDir *= -1;
  for (let inv of game.invaders) if (inv.alive) inv.y += INVADER_DROP;
}

function enemyFire(){
  // choose a random bottom-most invader in a random column
  // group alive invaders by column, choose random column that has alive
  const cols = {};
  for (let inv of game.invaders) if (inv.alive){
    cols[inv.col] = cols[inv.col] || [];
    cols[inv.col].push(inv);
  }
  const availableCols = Object.keys(cols);
  if (!availableCols.length) return;
  const col = availableCols[Math.floor(Math.random()*availableCols.length)];
  const bottom = cols[col].sort((a,b)=>b.row-a.row)[0];
  // shoot from bottom invader
  game.enemyBullets.push({ x: bottom.x + bottom.w/2 - 3, y: bottom.y + bottom.h, w:6, h:10 });
}

function shootPlayer(){
  const p = game.player;
  game.playerBullets.push({ x: p.x + p.w/2 - 3, y: p.y - 10, w:6, h:10 });
}

// collisions AABB
function rectsOverlap(a,b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function playerHit(){
  game.player.lives -= 1;
  if (game.player.lives <= 0) {
    lose();
  } else {
    // clear bullets and reset player position
    game.playerBullets = [];
    game.enemyBullets = [];
    game.player.x = CANVAS_W/2 - PLAYER_W/2;
  }
}

function lose(){
  game.gameOver = true;
  message.textContent = `Game Over — Score: ${game.score}`;
  overlay.style.display = 'block';
}

function win(){
  game.gameOver = true;
  message.textContent = `You win! Score: ${game.score}`;
  overlay.style.display = 'block';
}

// ====== Рендер ======
function render(){
  // clear
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

  // draw player
  const p = game.player;
  drawRect(p.x, p.y, p.w, p.h, '#2ef');

  // draw player bullets
  for (let b of game.playerBullets) drawRect(b.x, b.y, b.w, b.h, '#fffb');
  // draw enemy bullets
  for (let b of game.enemyBullets) drawRect(b.x, b.y, b.w, b.h, '#f44');

  // draw invaders
  for (let inv of game.invaders){
    if (!inv.alive) continue;
    // simple styling based on row
    const palette = ['#7fff7f','#ffd27f','#ffd27f','#ff7fbf'];
    const color = palette[Math.min(inv.row, palette.length-1)];
    drawRect(inv.x, inv.y, inv.w, inv.h, color);
    // eyes/detail as two small pixels
    ctx.fillStyle = '#000';
    ctx.fillRect(inv.x + 6, inv.y + 6, 4,4);
    ctx.fillRect(inv.x + inv.w - 10, inv.y + 6, 4,4);
  }

  // ground line
  ctx.fillStyle = '#333';
  ctx.fillRect(0, CANVAS_H - 48, CANVAS_W, 6);
}

// helper draw
function drawRect(x,y,w,h,fill){
  ctx.fillStyle = fill;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

// старт
startGame();
</script>
</body>
</html>
